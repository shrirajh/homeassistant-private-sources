name: Private Source Manager
version: "0.2.0"
slug: private_source_manager
description: Install and update integrations, Lovelace cards, themes and add-ons from private git repositories
url: https://github.com/shrirajh/homeassistant-private-sources
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
# Without this the panel exists but never reaches the sidebar.
ingress_panel: true
panel_icon: mdi:source-branch-check
panel_title: Private Sources
homeassistant_api: true
hassio_api: true
hassio_role: manager
tmpfs: true
backup: hot
backup_exclude:
  - keystore/*
map:
  - type: homeassistant_config
    read_only: false
  - type: addons
    read_only: false
options:
  log_level: info
  update_check_interval_hours: 6
  auto_lock_minutes: 0
  notify_on_update: true
schema:
  log_level: list(trace|debug|info|warning|error)
  update_check_interval_hours: int(0,168)
  auto_lock_minutes: int(0,1440)
  notify_on_update: bool
