name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to commit SHAs, not tags. A tag is mutable, so pinning to one
# means trusting whoever can move it. The trailing comment records the version.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # The bundle is committed so the Supervisor never needs Node on the device.
      # This fails if someone changed the source without rebuilding.
      - name: Committed bundle matches source
        run: |
          if ! git diff --quiet -- private_source_manager/app/psm/static; then
            echo "The committed frontend bundle is stale."
            echo "Run 'npm run build' in frontend/ and commit the result."
            git diff --stat -- private_source_manager/app/psm/static
            exit 1
          fi

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the add-on
        # home-assistant/actions publishes no releases, so this is the master head.
        uses: home-assistant/actions/hassio-addon-lint@a7c616ce81ccda50150bf1595786c71b1883fabb
        with:
          path: ./private_source_manager
