[project]
name = "psm"
version = "0.1.0"
description = "Home Assistant add-on for installing HA content from private git repositories"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14,<4",
    "cryptography>=46",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pyyaml>=6.0.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["private_source_manager/app/psm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["psm"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106"]
